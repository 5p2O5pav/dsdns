# ==================== DSDNS 配置文件示例 ====================
# 将此文件保存为 config.yaml，并根据实际环境修改参数

# -------------------- 日志配置 --------------------
log:
  # 日志级别：debug, info, warn, error
  # debug 会输出详细的 DNS 查询日志和匹配过程
  level: "info"

# -------------------- DNS 服务配置 --------------------
dns:
  # DNS 服务器监听地址，格式为 ":端口" 或 "IP:端口"
  # 建议使用非特权端口（如 5353），然后通过 iptables 转发 53 端口
  listen: ":5353"

# -------------------- Web 管理界面配置 --------------------
web:
  # Web 服务监听地址，用于提供管理后台和 API
  listen: ":8080"

# -------------------- 数据库配置 --------------------
db:
  # SQLite 数据库文件路径（主控模式使用）
  # 子节点模式可使用 node.db 或自定义路径
  path: "./dsdns.db"

# -------------------- IP 地理信息配置 --------------------
geo:
  # IPv4 地理数据库文件路径（ip2region 格式，需自行下载）
  ip2region_v4: "./ip2region_v4.xdb"
  # IPv6 地理数据库文件路径（可选，若不存在则 IPv6 查询返回空信息）
  ip2region_v6: "./ip2region_v6.xdb"

# -------------------- JWT 认证配置 --------------------
jwt:
  # JWT 签名密钥（生产环境务必修改为随机字符串，至少 32 字符）
  secret: "change-me-to-a-random-string"
  # JWT 有效期（小时）
  expire_hours: 24

# -------------------- 缓存配置 --------------------
cache:
  # IP 地理位置结果的内存缓存时间（秒）
  # 减少重复查询数据库的开销
  geo_ttl_sec: 600

# -------------------- 测活能力配置 --------------------
probe:
  # 是否启用 IPv4 测活（如果本机无 IPv4 或不想测 A 记录）
  ipv4_enabled: true
  # 是否启用 IPv6 测活（如果本机无 IPv6 或不想测 AAAA 记录）
  ipv6_enabled: true

# -------------------- 运行模式 --------------------
# master: 主控模式（提供 Web 管理、DNS 解析、节点调度）
# node:   子节点模式（只提供 DNS 解析，并接受主控同步）
mode: "master"

# -------------------- 主控相关参数（仅 master 模式生效） --------------------
controller:
  # 同步超时时间（秒）：向子节点发送增量或全量同步请求的超时时间
  sync_timeout_sec: 10
  # 心跳检测间隔（秒）：主控多久检查一次节点的心跳状态
  heartbeat_interval_sec: 120
  # 心跳超时阈值（秒）：超过此时间未收到心跳，将节点标记为 offline
  heartbeat_timeout_sec: 360
  # 测活任务执行间隔（秒）：定期对所有 DNS 记录进行健康检查
  check_interval_sec: 300
  # 健康度告警阈值：记录成功率低于此值（0~1）时触发告警
  check_success_threshold: 0.5

# -------------------- Telegram 告警配置 --------------------
telegram:
  # 是否启用 Telegram 机器人告警
  enabled: false
  # Telegram Bot Token（从 @BotFather 获取）
  bot_token: ""
  # 接收告警的 Chat ID（可以是个人或群组）
  chat_id: ""

# -------------------- 子节点专用配置（仅 mode=node 时生效） --------------------
node:
  # 子节点 ID（必须与主控中注册的节点 ID 一致）
  id: 1
  # 主控 API 地址（用于上报心跳、接收同步、上报测活结果）
  master_url: "http://localhost:8080"
  # 子节点的认证 Token（与主控注册时生成的 Token 一致）
  token: ""
  # 子节点内部 API 监听地址（用于接收主控的同步请求和测活触发）
  api_listen: ":9090"
  # 心跳上报间隔（秒）
  heartbeat_interval_sec: 120
